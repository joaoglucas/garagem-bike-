 customer:[['store','🛍','Loja de peças'],['booking','＋','Agendar serviço'],['tracking','⌁','Acompanhar minha bike'],['professionals','👨‍🔧','Profissionais'],['help','♡','Ajuda e cuidados']]
};
function navRender(){let role=$('#role').value;$('#nav').innerHTML=menus[role].map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${label}</button>`).join('');$('#avatar').textContent=role==='owner'?'GB':role==='mechanic'?'🔧':'🚴'}
function go(p){page=p;search='';$('#sidebar').classList.remove('open');render()}
function head(eyebrow,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,icon,note=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><h2>${value}</h2><small>${note}</small></div>`}
function card(title,body,sub='',action=''){return `<section class="card"><div class="cardhead"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${action}</div>${body}</section>`}
function badge(status){let c=status==='Pronta'||status==='Concluído'||status==='Pago'?'':status==='Em andamento'||status==='Alta'?'orange':status==='Aguardando'||status==='Solicitado'?'red':'gray';return `<span class="badge ${c}">${status}</span>`}
function jobRows(list){return list.length?`<div class="list">${list.map(j=>`<div class="item"><div class="itemicon">${j.type==='Revisão'?'🛠':'🔧'}</div><div class="itemmain"><strong>${j.bike}</strong><small>${j.service} • ${j.customer}</small><small>Responsável: ${j.mechanic} · ${j.date}</small></div><div class="itemend">${badge(j.status)}<strong>${money(j.price)}</strong><button class="linkbtn" onclick="editJob(${j.id})">Atualizar</button></div></div>`).join('')}</div>`:`<div class="empty">Nenhum serviço por aqui ainda.</div>`}
function productCards(list){return `<div class="grid products">${list.map(p=>`<div class="product"><div class="productart">${p.icon||'⚙️'}</div><div class="productbody"><strong>${p.name}</strong><small>${p.category} · ${p.stock} em estoque</small><div class="price">${money(p.price)}</div><button class="btn primary" onclick="buyProduct(${p.id})">Adicionar / comprar</button></div></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`}
function dashboardOwner(){let revenue=db.sales.reduce((s,x)=>s+x.price*x.qty,0),cost=db.sales.reduce((s,x)=>s+x.cost*x.qty,0),profit=revenue-cost,open=db.jobs.filter(j=>j.status!=='Pronta'&&j.status!=='Concluído').length,low=db.products.filter(p=>p.stock<=5).length;
return `<section class="garage-hero"><div class="hero-copy"><span class="hero-kicker">OFICINA • PEÇAS • CUIDADO</span><h2>GARAGEM <em>BIKE</em></h2><p class="hero-slogan">SUA BIKE<br><strong>EM BOAS MÃOS.</strong></p><div class="hero-note">Oficina 100% especializada em manutenção, peças e acessórios.</div><button class="btn lime" onclick="go('jobs')">Ver serviços <span>↗</span></button></div><div class="hero-art"><div class="hero-wheel"></div><div class="hero-bike">🚲</div><div class="hero-tag">RIDE • REPAIR • REPEAT</div></div></section>`+head('PAINEL DO DONO','Bom trabalho começa com controle.','Acompanhe o movimento da Garagem Bike em um só lugar.',`<button class="btn primary" onclick="openModal('sale')">＋ Registrar venda</button>`)+`<div class="grid stats">${stat('Vendas registradas',money(revenue),'↗','Total das vendas cadastradas')}${stat('Lucro bruto estimado',money(profit),'✦','Vendas menos custo das peças')}${stat('Serviços em aberto',open,'🔧','Ordens ainda não finalizadas')}${stat('Itens com estoque baixo',low,'⚠️','Confira o estoque')}</div><div class="grid columns">${card('Movimento da oficina',jobRows(db.jobs.slice(0,4)),'Serviços recentes',`<button class="linkbtn" onclick="go('team')">Ver equipe →</button>`)}<div>${card('Meta mensal',`<div class="goal"><div class="goalrow"><strong>Faturamento do mês</strong><span>${money(revenue)} / ${money(db.goal)}</span></div><div class="progress"><span style="width:${Math.min(100,revenue/Math.max(1,db.goal)*100)}%"></span></div><div class="goalrow" style="margin:10px 0 0"><span>${Math.min(100,Math.round(revenue/Math.max(1,db.goal)*100))}% alcançado</span><button class="linkbtn" onclick="go('goals')">Editar meta</button></div></div>`,'Meta ajustável')}${card('Atenção necessária',`<div class="list"><div class="item"><div class="itemicon">📦</div><div class="itemmain"><strong>${low} produtos com estoque baixo</strong><small>Reponha antes que faltem</small></div><button class="linkbtn" onclick="go('inventory')">Ver</button></div><div class="item"><div class="itemicon">🧾</div><div class="itemmain"><strong>${db.requests.length} pedidos de peças</strong><small>Solicitações da oficina</small></div><button class="linkbtn" onclick="go('inventory')">Ver</button></div></div>`,'Resumo operacional')}</div></div>`}
function dashboardMechanic(){let open=db.jobs.filter(j=>j.status!=='Pronta'&&j.status!=='Concluído'),ready=db.jobs.filter(j=>j.status==='Pronta'||j.status==='Concluído');return head('PAINEL MECÂNICO','Bora deixar tudo rodando.','Organize sua fila de trabalho e atualize cada bicicleta.',`<button class="btn primary" onclick="openModal('job')">＋ Nova ordem</button>`)+`<div class="grid stats">${stat('Na fila',open.length,'🧰','Serviços aguardando conclusão')}${stat('Manutenções',open.filter(j=>j.type==='Manutenção').length,'🔧','A fazer')}${stat('Revisões',open.filter(j=>j.type==='Revisão').length,'🛠','A fazer')}${stat('Bikes prontas',ready.length,'✓','Prontas para retirada')}</div><div class="grid columns">${card('Serviços a fazer',jobRows(open),'Atualize o status conforme avança')}${card('Bicicletas prontas',jobRows(ready),'Concluídas e aguardando retirada')}${card('Estoque rápido',table(['Peça','Disponível','Status'],db.products.map(p=>`<tr><td class="tabletitle">${p.name}</td><td>${p.stock}</td><td>${p.stock<=5?badge('Baixo'):badge('Disponível')}</td></tr>`)),'Peças disponíveis',`<button class="linkbtn" onclick="go('requests')">Pedir peças →</button>`)}${card('Pedidos de peças',requestList(),'Solicitações da oficina',`<button class="linkbtn" onclick="openModal('request')">＋ Novo pedido</button>`)}</div>`}
function requestList(){return db.requests.length?`<div class="list">${db.requests.map(r=>`<div class="item"><div class="itemicon">📦</div><div class="itemmain"><strong>${r.item}</strong><small>Quantidade: ${r.qty} · Prioridade: ${r.priority}</small></div><div class="itemend">${badge(r.status)}<button class="linkbtn" onclick="completeRequest(${r.id})">Recebido</button></div></div>`).join('')}</div>`:'<div class="empty">Nenhum pedido de peça.</div>'}
function dashboardCustomer(){return head('ÁREA DO CLIENTE','Sua bike em boas mãos.','Peças, manutenção e revisão sem complicação.',`<button class="btn primary" onclick="go('booking')">＋ Agendar serviço</button>`)+`<div class="grid stats">${stat('Peças na loja',db.products.length,'🛍','Confira as opções disponíveis')}${stat('Serviços oferecidos','3','🛠','Manutenção, revisão e ajustes')}${stat('Profissionais','2','👨‍🔧','Equipe da oficina')}${stat('Agendamento','Fácil','📅','Peça seu horário')}</div>${card('Mais procurados',productCards(db.products.slice(0,3)),'Peças e acessórios para pedalar')}${card('Serviços da oficina',`<div class="grid servicegrid"><div class="service"><div class="itemicon">🔧</div><h3>Manutenção</h3><p>Diagnóstico e reparos para sua bike voltar à estrada.</p><button class="btn secondary" onclick="bookingType('Manutenção')">Agendar</button></div><div class="service"><div class="itemicon">🛠</div><h3>Revisão completa</h3><p>Checagem de freios, transmissão, rodas e segurança.</p><button class="btn secondary" onclick="bookingType('Revisão')">Agendar</button></div><div class="service"><div class="itemicon">⚙️</div><h3>Ajustes rápidos</h3><p>Regulagens, troca de peças e pequenos reparos.</p><button class="btn secondary" onclick="bookingType('Ajuste')">Agendar</button></div></div>`,'Escolha o cuidado ideal para sua bicicleta')}`}
function inventoryPage(){return head('ESTOQUE','Estoque de peças','Controle disponibilidade, preços e reposição.',`<button class="btn primary" onclick="openModal('product')">＋ Cadastrar peça</button>`)+`<div class="searchrow"><input placeholder="Buscar peça ou categoria..." value="${search}" oninput="search=this.value;renderBodyOnly()"><button class="btn secondary" onclick="go('requests')">＋ Pedir peças</button></div>`+card('Peças cadastradas',table(['Produto','Categoria','Custo','Preço de venda','Estoque','Ação'],db.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(search.toLowerCase())).map(p=>`<tr><td class="tabletitle">${p.icon||'⚙️'} ${p.name}</td><td>${p.category}</td><td>${money(p.cost)}</td><td><b>${money(p.price)}</b></td><td>${p.stock<=5?badge('Baixo'):badge('Disponível')} ${p.stock}</td><td><button class="linkbtn" onclick="adjustStock(${p.id})">Ajustar</button></td></tr>`)),'Preços e quantidades atuais')}
function salesPage(){let rev=db.sales.reduce((s,x)=>s+x.price*x.qty,0),cost=db.sales.reduce((s,x)=>s+x.cost*x.qty,0);return head('FINANCEIRO','Vendas e lucro','Veja o valor vendido e a despesa de cada item.',`<button class="btn primary" onclick="openModal('sale')">＋ Registrar venda</button>`)+`<div class="grid stats">${stat('Faturamento',money(rev),'↗','Vendas registradas')}${stat('Custo dos itens',money(cost),'📦','Despesa associada aos produtos')}${stat('Lucro bruto',money(rev-cost),'✦','Faturamento menos custo')}${stat('Vendas registradas',db.sales.length,'🧾','Lançamentos no sistema')}</div>`+card('Histórico de vendas',table(['Data','Item vendido','Qtd.','Venda unitária','Custo unitário','Lucro bruto','Cliente'],db.sales.map(s=>`<tr><td>${s.date}</td><td class="tabletitle">${s.item}</td><td>${s.qty}</td><td>${money(s.price)}</td><td>${money(s.cost)}</td><td class="good"><b>${money((s.price-s.cost)*s.qty)}</b></td><td>${s.customer}</td></tr>`)),'Cada venda mostra o custo e a margem estimada')}
function jobsPage(readyOnly=false){let list=db.jobs.filter(j=>!readyOnly||j.status==='Pronta'||j.status==='Concluído');return head(readyOnly?'BIKES PRONTAS':'ORDENS DE SERVIÇO',readyOnly?'Prontas para retirada':'Fila de manutenção e revisão',readyOnly?'Confira as bicicletas finalizadas.':'Acompanhe o que falta fazer em cada bicicleta.',`<button class="btn primary" onclick="openModal('job')">＋ Nova ordem</button>`)+card('Ordens registradas',jobRows(list),'Clique em Atualizar para mudar o status')}
function storePage(){return head('BIKE SHOP','Peças e acessórios','Explore produtos para equipar e cuidar da sua bicicleta.')+`<div class="searchrow"><input placeholder="Buscar pneus, aros, câmaras..." value="${search}" oninput="search=this.value;renderBodyOnly()"></div>`+productCards(db.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(search.toLowerCase())))}
function bookingPage(){return head('AGENDAMENTO','Vamos cuidar da sua bike?','Conte pra gente o que sua bicicleta precisa.')+card('Solicitar manutenção ou revisão',`<form onsubmit="submitBooking(event)"><div class="formgrid"><div class="field"><label>Seu nome</label><input name="customer" required placeholder="Como podemos te chamar?"></div><div class="field"><label>Contato (telefone ou e-mail)</label><input name="contact" required placeholder="(00) 00000-0000"></div><div class="field"><label>Modelo da bicicleta</label><input name="bike" required placeholder="Marca, modelo e aro"></div><div class="field"><label>Tipo de serviço</label><select name="type" id="bookingtype"><option>Manutenção</option><option>Revisão</option><option>Ajuste</option></select></div><div class="field"><label>Data desejada</label><input type="date" name="date" min="${dateNow()}" required></div><div class="field"><label>Profissional preferido</label><select name="mechanic"><option>Sem preferência</option><option>Rafael</option><option>Diego</option></select></div><div class="field full"><label>O que está acontecendo com a bike?</label><textarea name="service" placeholder="Descreva o problema ou o que deseja revisar"></textarea></div></div><div class="formactions"><button class="btn primary">Enviar solicitação</button></div></form>`,'Sua solicitação aparecerá na fila da oficina')}
function teamPage(){return head('EQUIPE','Acompanhe o trabalho da equipe','Veja os serviços atribuídos e o que já foi concluído.',`<button class="btn primary" onclick="openModal('job')">＋ Atribuir serviço</button>`)+card('Progresso da oficina',jobRows(db.jobs),'Ordens de serviço e responsáveis')}
function purchasesPage(){return head('COMPRAS','Compras da oficina','Registre peças, fornecedores e valores pagos.',`<button class="btn primary" onclick="openModal('purchase')">＋ Registrar compra</button>`)+card('Histórico de compras',table(['Data','Item comprado','Fornecedor','Valor'],db.purchases.map(p=>`<tr><td>${p.date}</td><td class="tabletitle">${p.item}</td><td>${p.supplier}</td><td><b>${money(p.price)}</b></td></tr>`)))}
function expensesPage(){return head('DESPESAS EXTERNAS','Despesas fora da oficina','Registre contas e gastos que não são ligados diretamente às peças.',`<button class="btn primary" onclick="openModal('expense')">＋ Nova despesa</button>`)+card('Despesas cadastradas',table(['Data','Descrição','Categoria','Valor'],db.expenses.map(e=>`<tr><td>${e.date}</td><td class="tabletitle">${e.item}</td><td>${e.category}</td><td><b>${money(e.price)}</b></td></tr>`)))}
function goalsPage(){let rev=db.sales.reduce((s,x)=>s+x.price*x.qty,0);return head('PLANEJAMENTO','Meta do mês','Altere o valor da meta quando quiser acompanhar um novo objetivo.')+card('Sua meta mensal',`<div class="goal"><div class="goalrow"><strong>Faturamento acumulado</strong><span>${money(rev)}</span></div><div class="progress"><span style="width:${Math.min(100,rev/Math.max(1,db.goal)*100)}%"></span></div><div class="goalrow" style="margin:10px 0 0"><span>${Math.round(rev/Math.max(1,db.goal)*100)}% da meta atingida</span><strong>${money(db.goal)}</strong></div></div><form onsubmit="saveGoal(event)" style="margin-top:20px"><div class="field"><label>Nova meta de faturamento (R$)</label><input type="number" min="1" step=".01" name="goal" value="${db.goal}" required></div><div class="formactions"><button class="btn primary">Salvar meta</button></div></form>`,'Meta editável')}
function requestsPage(){return head('REPOSIÇÃO','Pedidos de peças','Avise ao dono o que precisa ser comprado.',`<button class="btn primary" onclick="openModal('request')">＋ Pedir peça</button>`)+card('Solicitações de compra',requestList(),'Pedidos enviados pela equipe')}
function professionalsPage(){return head('PROFISSIONAIS','Quem vai cuidar da sua bike','Conheça a equipe disponível para manutenção e revisão.')+`<div class="grid servicegrid"><div class="card"><div class="itemicon">👨‍🔧</div><h3>Rafael</h3><p class="muted">Mecânico · Manutenção, freios e transmissão</p>${badge('Disponível')}<p style="margin-top:15px"><button class="btn secondary" onclick="bookingType('Manutenção')">Agendar com Rafael</button></p></div><div class="card"><div class="itemicon">🧑‍🔧</div><h3>Diego</h3><p class="muted">Mecânico · Revisão geral e regulagens</p>${badge('Disponível')}<p style="margin-top:15px"><button class="btn secondary" onclick="bookingType('Revisão')">Agendar com Diego</button></p></div></div>`}
function helpPage(){return head('DICAS E SUPORTE','Pedale com tranquilidade','Alguns cuidados simples ajudam a manter sua bike segura.')+`<div class="grid servicegrid"><div class="card"><div class="itemicon">🛞</div><h3>Calibragem</h3><p class="muted">Confira a pressão indicada no pneu antes de pedalar.</p></div><div class="card"><div class="itemicon">🧼</div><h3>Limpeza</h3><p class="muted">Mantenha a transmissão limpa e lubrificada com produto adequado.</p></div><div class="card"><div class="itemicon">🛑</div><h3>Freios</h3><p class="muted">Se notar ruídos ou perda de eficiência, procure uma revisão.</p></div></div>`}
function trackingPage(){return head('ACOMPANHAMENTO','Como está sua bike?','Consulte as ordens de serviço registradas na oficina.')+card('Ordens de serviço',jobRows(db.jobs),'Para consultar, procure pelo modelo da sua bicicleta na lista')}
function renderBodyOnly(){let el=$('#bodycontent');if(el)el.innerHTML=pageContent()}
function pageContent(){let role=$('#role').value;if(page==='dashboard')return role==='owner'?dashboardOwner():role==='mechanic'?dashboardMechanic():dashboardCustomer();switch(page){case'inventory':return inventoryPage();case'sales':return salesPage();case'jobs':return jobsPage();case'ready':return jobsPage(true);case'store':return storePage();case'booking':return bookingPage();case'team':return teamPage();case'purchases':return purchasesPage();case'expenses':return expensesPage();case'goals':return goalsPage();case'requests':return requestsPage();case'professionals':return professionalsPage();case'help':return helpPage();case'tracking':return trackingPage();default:return dashboardOwner()}}
function render(){navRender();let labels={dashboard:'Visão geral',sales:'Vendas e lucro',inventory:'Estoque de peças',purchases:'Compras',expenses:'Despesas externas',team:'Equipe e serviços',goals:'Metas do mês',store:'Loja de peças',jobs:'Ordens de serviço',ready:'Bikes prontas',requests:'Pedidos de peças',booking:'Agendar serviço',tracking:'Acompanhar minha bike',professionals:'Profissionais',help:'Ajuda e cuidados'};$('#crumb').textContent=labels[page]||'Visão geral';$('#topTitle').textContent=labels[page]||'Visão geral';$('#content').innerHTML=`<div id="bodycontent">${pageContent()}</div><div class="footnote">Garagem Bike · Painel demonstrativo. Os dados ficam salvos neste navegador.</div>`}
$('#role').addEventListener('change',()=>{page='dashboard';render()});
function toast(msg){$('#toastroot').innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',3000)}
function openModal(type){let title='',body='';const field=(label,name,placeholder='',kind='text',value='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${kind}" placeholder="${placeholder}" value="${value}" ${['price','cost','stock','qty','goal'].includes(name)?'min="0" step="0.01"':''} required></div>`;
if(type==='product'){title='Cadastrar peça';body=`<form onsubmit="submitModal(event,'product')"><div class="formgrid">${field('Nome da peça','name','Ex.: Pneu aro 29')}${field('Categoria','category','Ex.: Pneus')}${field('Preço de custo (R$)','cost','','number')}${field('Preço de venda (R$)','price','','number')}${field('Quantidade em estoque','stock','','number')}${field('Ícone/emoji','icon','⚙️')}</div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar peça</button></div></form>`}
if(type==='job'){title='Nova ordem de serviço';body=`<form onsubmit="submitModal(event,'job')"><div class="formgrid">${field('Cliente','customer','Nome do cliente')}${field('Modelo da bicicleta','bike','Marca e modelo')}${`<div class="field"><label>Tipo de serviço</label><select name="type"><option>Manutenção</option><option>Revisão</option><option>Ajuste</option></select></div>`}${`<div class="field"><label>Mecânico responsável</label><select name="mechanic"><option>Rafael</option><option>Diego</option><option>A definir</option></select></div>`}${field('Serviço a realizar','service','Ex.: Revisão completa')}${field('Valor estimado (R$)','price','','number')}${field('Data','date','','date',dateNow())}<div class="field"><label>Status</label><select name="status"><option>Aguardando</option><option>Em andamento</option><option>Pronta</option></select></div></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Criar ordem</button></div></form>`}
if(type==='sale'){title='Registrar venda';body=`<form onsubmit="submitModal(event,'sale')"><div class="formgrid"><div class="field full"><label>Produto</label><select name="product" required>${db.products.map(p=>`<option value="${p.id}">${p.name} — estoque ${p.stock} — ${money(p.price)}</option>`).join('')}</select></div>${field('Quantidade','qty','','number')}${field('Nome do cliente','customer','Cliente balcão')}</div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Registrar venda</button></div></form>`}
if(type==='purchase'){title='Registrar compra';body=`<form onsubmit="submitModal(event,'purchase')"><div class="formgrid">${field('Item comprado','item','Peças ou material')}${field('Fornecedor','supplier','Nome do fornecedor')}${field('Valor total (R$)','price','','number')}${field('Data','date','','date',dateNow())}</div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar compra</button></div></form>`}
if(type==='expense'){title='Registrar despesa externa';body=`<form onsubmit="submitModal(event,'expense')"><div class="formgrid">${field('Descrição','item','Ex.: internet, água')}${field('Valor (R$)','price','','number')}${field('Categoria','category','Fora da oficina')}${field('Data','date','','date',dateNow())}</div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar despesa</button></div></form>`}
if(type==='request'){title='Pedir peças';body=`<form onsubmit="submitModal(event,'request')"><div class="formgrid">${field('Peça necessária','item','Ex.: pneu aro 29')}${field('Quantidade','qty','','number')}<div class="field"><label>Prioridade</label><select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></div>${field('Data do pedido','date','','date',dateNow())}</div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Enviar pedido</button></div></form>`}
$('#modalroot').innerHTML=`<div style="position:fixed;inset:0;background:#10271d88;z-index:30;display:grid;place-items:center;padding:16px" onclick="if(event.target===this)closeModal()"><section class="card" style="width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 90px #0003"><div class="cardhead"><div><div class="eyebrow">GARAGEM BIKE</div><h3 style="font-size:20px;margin-top:4px">${title}</h3></div><button class="btn secondary" onclick="closeModal()">✕</button></div>${body}</section></div>`}
function closeModal(){$('#modalroot').innerHTML=''}
function submitModal(e,type){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());const num=k=>Number(f[k]||0);
if(type==='product'){db.products.push({id:Date.now(),name:f.name,category:f.category,cost:num('cost'),price:num('price'),stock:num('stock'),icon:f.icon||'⚙️'})}
if(type==='job'){db.jobs.unshift({id:Date.now(),...f,price:num('price'),status:f.status||'Aguardando'})}
if(type==='sale'){let p=db.products.find(p=>p.id===Number(f.product));let qty=num('qty');if(!p||qty<1||p.stock<qty){toast('Estoque insuficiente para essa venda.');return}p.stock-=qty;db.sales.unshift({id:Date.now(),item:p.name,qty,price:p.price,cost:p.cost,date:dateNow(),customer:f.customer||'Cliente balcão'})}
if(type==='purchase')db.purchases.unshift({id:Date.now(),...f,price:num('price')});
if(type==='expense')db.expenses.unshift({id:Date.now(),...f,price:num('price')});
if(type==='request')db.requests.unshift({id:Date.now(),...f,qty:num('qty'),status:'Solicitado'});
save();closeModal();render();toast('Informações salvas com sucesso!')}
function editJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;$('#modalroot').innerHTML=`<div style="position:fixed;inset:0;background:#10271d88;z-index:30;display:grid;place-items:center;padding:16px" onclick="if(event.target===this)closeModal()"><section class="card" style="width:min(500px,100%)"><div class="cardhead"><h3>Atualizar serviço</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><p><strong>${j.bike}</strong><br><span class="muted">${j.service}</span></p><form onsubmit="updateJob(event,${id})"><div class="field"><label>Status</label><select name="status"><option ${j.status==='Aguardando'?'selected':''}>Aguardando</option><option ${j.status==='Em andamento'?'selected':''}>Em andamento</option><option ${j.status==='Pronta'?'selected':''}>Pronta</option><option ${j.status==='Concluído'?'selected':''}>Concluído</option></select></div><div class="field" style="margin-top:12px"><label>Mecânico responsável</label><select name="mechanic"><option ${j.mechanic==='Rafael'?'selected':''}>Rafael</option><option ${j.mechanic==='Diego'?'selected':''}>Diego</option><option>A definir</option></select></div><div class="formactions"><button class="btn primary">Salvar atualização</button></div></form></section></div>`}
function updateJob(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries()),j=db.jobs.find(x=>x.id===id);Object.assign(j,f);save();closeModal();render();toast('Status do serviço atualizado!')}
function adjustStock(id){let p=db.products.find(x=>x.id===id),n=prompt(`Quantidade atual: ${p.stock}\nDigite a nova quantidade:`);if(n!==null&&n.trim()!==''&&Number(n)>=0){p.stock=Number(n);save();render();toast('Estoque atualizado!')}}
function completeRequest(id){let r=db.requests.find(x=>x.id===id);if(!r)return;r.status='Recebido';let p=db.products.find(x=>x.name.toLowerCase()===r.item.toLowerCase());if(p)p.stock+=Number(r.qty);save();render();toast('Pedido marcado como recebido!')}
function buyProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;if(p.stock<1){toast('Produto indisponível no estoque.');return}let customer=prompt(`Solicitar compra de ${p.name} por ${money(p.price)}.\nDigite seu nome para registrar a solicitação:`);if(customer&&customer.trim()){db.sales.unshift({id:Date.now(),item:p.name,qty:1,price:p.price,cost:p.cost,date:dateNow(),customer:customer.trim()});p.stock--;save();render();toast('Solicitação registrada no demonstrativo!')}}
function bookingType(t){go('booking');setTimeout(()=>{let el=$('#bookingtype');if(el)el.value=t},0)}
function submitBooking(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());db.jobs.unshift({id:Date.now(),bike:f.bike,customer:f.customer,type:f.type,service:(f.service||'Serviço solicitado')+(f.contact?' · Contato: '+f.contact:''),mechanic:f.mechanic==='Sem preferência'?'A definir':f.mechanic,status:'Aguardando',date:f.date,price:0});save();render();toast('Solicitação enviada! A oficina poderá confirmar o horário.')}
function saveGoal(e){e.preventDefault();db.goal=Number(new FormData(e.target).get('goal'));save();render();toast('Meta mensal atualizada!')}
render();
</script>
</body></html>
